  <!-- JavaScript Module for Dynamic Natural Page Breaking & Standalone HTML Generation -->
  <script>
    /**
     * WMS Thermocol Tax Invoice Engine
     * Layout: A4 Landscape (297mm x 210mm)
     * Natural Page Breaking:
     * - First page fills up naturally without artificial fixed row caps.
     * - When items overflow, a continuation page is generated.
     * - "To be continued..." is placed at bottom-right of non-final pages (English only).
     * - Summary totals, transporter info, and authorized signature appear exclusively on the last page.
     */

    // Indian Currency Number to Words Formatter
    function numberToWordsINR(amount) {
      const num = Math.round(Number(amount) || 0);
      if (num === 0) return "Zero Rupees Only";

      const a = [
        "", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
        "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"
      ];
      const b = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

      function inWords(n) {
        let str = "";
        if (n > 19) {
          str += b[Math.floor(n / 10)] + (n % 10 !== 0 ? " " + a[n % 10] : "");
        } else if (n > 0) {
          str += a[n];
        }
        return str;
      }

      let crore = Math.floor(num / 10000000);
      let remainder = num % 10000000;
      let lakh = Math.floor(remainder / 100000);
      remainder = remainder % 100000;
      let thousand = Math.floor(remainder / 1000);
      remainder = remainder % 1000;
      let hundred = Math.floor(remainder / 100);
      let tens = remainder % 100;

      let res = "";
      if (crore > 0) res += inWords(crore) + " Crore ";
      if (lakh > 0) res += inWords(lakh) + " Lakh ";
      if (thousand > 0) res += inWords(thousand) + " Thousand ";
      if (hundred > 0) res += inWords(hundred) + " Hundred ";
      if (tens > 0) res += (res !== "" ? "and " : "") + inWords(tens) + " ";

      return (res.trim() + " Rupees Only");
    }

    // Default Sample Thermocol / Packing Material Invoice Data
    const sampleInvoice = {
      invoiceNo: "STN/2026/0491",
      date: "2026-10-24",
      placeOfSupply: "Madhya Pradesh (23)",
      poReference: "PO-WH-IND-9921",
      reverseCharge: "No",

      // Consignor (Shipped & Dispatched From)
      consignor: {
        name: "ABBOTT HEALTHCARE PRIVATE LIMITED",
        subDivision: "Central Warehousing & Logistics Division",
        address: "Survey No 52/2/2, Peer Karadiya, Kshipra Road, Tehsil - Sanwer, Indore - 453771 (M.P.)",
        gstin: "23AAACA0231P1Z1",
        pan: "AAACA0231P",
        state: "Madhya Pradesh",
        stateCode: "23"
      },

      // Consignee (Billed To / Stock Transfer Destination)
      consignee: {

        address: "Plot No. 14/B, Changodar Industrial Estate, Sanand, Ahmedabad - 382213 (Gujarat)",
        gstin: "24AAACA0231P1ZA",

      },

      // Logistics & Transporter Details
      transporter: {

        vehicleNo: "MP-09-GH-8821",

        lrDate: "2026-10-24",

        weight: "1,420 KGS",

        driverPhone: "+91 98260 11223"
      },

      // Items list will be populated dynamically

    };

    // Predefined realistic Thermocol & Packaging Items for WMS
    const thermocolProductCatalog = [
      { name: 'Thermocol Box 12 Litre Molded EPS High Density', hsn: '39239090', unit: 'NOS', rate: 145.00 },
      { name: 'Thermocol Box 24 Litre Cold Chain Ice Box', hsn: '39239090', unit: 'NOS', rate: 215.00 },
      { name: 'Thermocol Box 36 Litre Insulated Vaccine Shipper', hsn: '39239090', unit: 'NOS', rate: 320.00 },
      { name: 'Thermocol Lid Top Cover EPS 25mm thickness', hsn: '39239090', unit: 'NOS', rate: 45.00 },
      { name: 'Thermocol Corner Protector 3-Way Heavy Duty', hsn: '39239090', unit: 'NOS', rate: 18.50 },
      { name: 'Thermocol Sheet 50mm High Density EPS Insulation', hsn: '39239090', unit: 'SHT', rate: 180.00 },
      { name: 'Thermocol Partition Separator Plate 6 Cavity', hsn: '39239090', unit: 'NOS', rate: 65.00 },
      { name: 'HDPE Gel Pack Bottle 500ml Phase Change Coolant', hsn: '38249900', unit: 'NOS', rate: 38.00 },
      { name: 'Corrugated Outer Shipper 7-Ply Heavy Master Box', hsn: '48191010', unit: 'NOS', rate: 95.00 },
      { name: 'BOPP Self Adhesive Transparent Packaging Tape 3"', hsn: '39191000', unit: 'ROL', rate: 58.00 },
      { name: 'Thermal Insulation Bubble Shield Roll 1.2m x 50m', hsn: '39269099', unit: 'ROL', rate: 840.00 },
      { name: 'Polyethylene Stretch Wrap Film 23 Micron Industrial', hsn: '39201019', unit: 'ROL', rate: 420.00 },
      { name: 'Moisture Barrier Silica Gel Desiccant Sachet 100g', hsn: '28112200', unit: 'PKT', rate: 22.00 },
      { name: 'Fragile Handle With Care Temperature Sensitive Label', hsn: '48211010', unit: 'ROL', rate: 140.00 },
      { name: 'Thermocol Base Tray 10 Cavity Ampoule Protection', hsn: '39239090', unit: 'NOS', rate: 52.00 },
      { name: 'Molded Pulp Edge Board Corner Protector 50x50x4', hsn: '48239090', unit: 'NOS', rate: 28.00 }
    ];

    /**
     * Natural Capacity Chunker
     * Evaluates natural printable space for A4 landscape:
     * - In A4 landscape, available vertical height without summary block fits ~16 items.
     * - The final page with summary totals, transporter box, and signature fits up to ~11 items.
     * - If total items <= 11, exactly 1 page is generated with everything.
     * - If total items > 11, page 1 takes up to 16 items naturally, and remaining items flow to subsequent page(s).
     */
    function splitItemsForNaturalPages(items) {
      const total = items.length;
      if (total <= 11) {
        return [items];
      }

      const chunks = [];
      let currentIndex = 0;

      while (currentIndex < total) {
        const remaining = total - currentIndex;
        
        // If remaining items can fit on a final page with summary (<= 11)
        if (remaining <= 11) {
          chunks.push(items.slice(currentIndex, total));
          break;
        }

        // If remaining is slightly over 11 (e.g. 12 to 14), we take 14 to avoid leaving just 1 item on last page
        let takeCount = 16;
        if (remaining <= 16) {
          // If we took 16, nothing remains; but if remaining is 13, taking 16 takes all 13,
          // however 13 is > 11 so it wouldn't fit with summary on one page!
          // Thus take 8 and leave 5 for last page with summary.
          takeCount = Math.ceil(remaining / 2);
        }

        chunks.push(items.slice(currentIndex, currentIndex + takeCount));
        currentIndex += takeCount;
      }

      return chunks;
    }

    /**
     * Render the complete multi-page or single-page Invoice
     */
    function renderInvoice(invoiceData) {
      const container = document.getElementById('invoicePagesContainer');
      if (!container) return;

      // Calculate totals
      let totalQty = 0;
      let totalTaxable = 0;
      let totalIGST = 0;

      invoiceData.items.forEach(it => {
        const qty = Number(it.qty) || 0;
        const rate = Number(it.rate) || 0;
        const taxable = qty * rate;
        totalQty += qty;
        totalTaxable += taxable;
        // 18% IGST on packaging materials for inter-state stock transfer
        totalIGST += (taxable * 0.18);
      });

      const grandTotal = totalTaxable + totalIGST;
      const totalInWords = numberToWordsINR(grandTotal);

      // Split into natural chunks
      const pages = splitItemsForNaturalPages(invoiceData.items);
      const totalPages = pages.length;

      let html = "";
      let globalItemIndex = 0;

      pages.forEach((pageItems, pageIdx) => {
        const pageNumber = pageIdx + 1;
        const isLastPage = (pageNumber === totalPages);

        html += `
          <div class="invoice-page">
            <div class="page-main-content">
              
              <!-- 1. Header Box: Consignor details on left, Title & Invoice details on right -->
              <div class="header-box">
                <div class="consignor-header-left">
                  <div class="company-title">${invoiceData.consignor.name}</div>
                  <div class="company-address">${invoiceData.consignor.address}</div>
                  <div class="company-tax-info">
                    GSTIN: <b>${invoiceData.consignor.gstin}</b> | PAN: <b>${invoiceData.consignor.pan}</b> | State: <b>${invoiceData.consignor.state} (${invoiceData.consignor.stateCode})</b>
                  </div>
                </div>

                <div class="invoice-header-right">
                  <div class="invoice-title-banner">
                    TAX INVOICE (STOCK TRANSFER NOTE)
                  </div>
                  <div class="invoice-meta-grid">
                    <div class="invoice-meta-row">
                      <span class="label">Invoice / STN No:</span>
                      <span class="val">${invoiceData.invoiceNo}</span>
                    </div>
                    <div class="invoice-meta-row">
                      <span class="label">Invoice Date:</span>
                      <span class="val">${invoiceData.date}</span>
                    </div>
                    <div class="invoice-meta-row">
                      <span class="label">Place of Supply:</span>

                      const rate = Number(item.rate) || 0;

                      return `

                    </div>
                  </div>

                  <div class="summary-box">
                    <div class="totals-grid">
                      <div class="totals-row">
                        <span>Total Taxable Value:</span>
                        <span style="font-weight: 700; font-family: Consolas, monospace;">₹${totalTaxable.toFixed(2)}</span>
                      </div>
                      <div class="totals-row">

                      </div>
                      <div class="signature-line">Authorized Signatory / Warehouse In-charge</div>
                    </div>
                  </div>
                </div>
              ` : ''}

            <div class="invoice-footer">
              <div class="declaration-text">

              </div>

                Page ${pageNumber} of ${totalPages}

            </div>

          </div>
        `;
      });

      container.innerHTML = html;

    /**
     * Helper to load dynamic sample test datasets
     */
    function loadSampleData(itemCount) {
      const items = [];
      for (let i = 0; i < itemCount; i++) {
        const template = thermocolProductCatalog[i % thermocolProductCatalog.length];
        items.push({
          name: `${template.name} [Size #${(i % 5) + 1}]`,
          hsn: template.hsn,
          qty: 10 + ((i + 1) * 5),
          unit: template.unit,
          rate: template.rate
        });
      }
      sampleInvoice.items = items;
      renderInvoice(sampleInvoice);
    }
