    // Indian Currency Number to Words Formatter
    function numberToWordsINR(amount) {
      const num = Math.round(Number(amount) || 0);
      if (num === 0) return "Zero Rupees Only";

      const a = [
        "", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
        "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"
      ];
      const b = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

      function inWords(n) {
        let str = "";
        if (n > 19) {
          str += b[Math.floor(n / 10)] + (n % 10 !== 0 ? " " + a[n % 10] : "");
        } else if (n > 0) {
          str += a[n];
        }
        return str;
      }

      let crore = Math.floor(num / 10000000);
      let remainder = num % 10000000;
      let lakh = Math.floor(remainder / 100000);
      remainder = remainder % 100000;
      let thousand = Math.floor(remainder / 1000);
      remainder = remainder % 1000;
      let hundred = Math.floor(remainder / 100);
      let tens = remainder % 100;

      let res = "";
      if (crore > 0) res += inWords(crore) + " Crore ";
      if (lakh > 0) res += inWords(lakh) + " Lakh ";
      if (thousand > 0) res += inWords(thousand) + " Thousand ";
      if (hundred > 0) res += inWords(hundred) + " Hundred ";
      if (tens > 0) res += (res !== "" ? "and " : "") + inWords(tens) + " ";

      return (res.trim() + " Rupees Only");
    }

    /**
     * Natural Content Auto-Fit Slicer:
     * Fits up to 8 items on the final page together with the bottom summary blocks.
     * On continuation pages (no summary), fits up to 14 items comfortably.
     */
    function partitionItemsNaturally(items) {
      const total = items.length;
      if (total === 0) return [[]];

      if (total <= 8) {
        return [items];
      }

      const pages = [];
      let startIdx = 0;

      while (startIdx < total) {
        const remaining = total - startIdx;
        if (remaining <= 8) {
          pages.push(items.slice(startIdx, total));
          break;
        }

        let take = 14;
        if (remaining <= 14) {
          take = Math.ceil(remaining / 2);
        }

        pages.push(items.slice(startIdx, startIdx + take));
        startIdx += take;
      }

      return pages;
    }

    /**
     * Main Render Routine
     */
    function renderInvoice(invoiceData) {
      const container = document.getElementById('invoicePagesContainer');
      if (!container) return;

      // Compute financial totals
      let totalQty = 0;
      let totalCases = 0;
      let totalTaxable = 0;
      let totalIGST = 0;

      invoiceData.items.forEach(it => {
        const qty = Number(it.qty) || 0;
        const rate = Number(it.rate) || 0;
        const cases = Number(it.cases) || 1;
        const taxable = qty * rate;
        totalQty += qty;
        totalCases += cases;
        totalTaxable += taxable;
        totalIGST += (taxable * 0.18); // 18% IGST on stock transfer
      });

    /**

    function loadPreset(count) {
      const buttons = document.querySelectorAll('.btn-test');
      buttons.forEach(b => {
        b.classList.remove('active');
        if (b.textContent.includes(`${count} Item`)) {
          b.classList.add('active');
        }
      });

      const items = [];
      for (let i = 0; i < count; i++) {
        const prod = thermocolProductCatalog[i % thermocolProductCatalog.length];
        const qty = 10 + ((i + 1) * 5);
        const cases = Math.ceil(qty / (prod.packSizeMultiple || 10));
        items.push({
          name: `${prod.name} [Lot #${(i % 4) + 1}]`,
          hsn: prod.hsn,
          qty: qty,
          cases: cases,
          unit: prod.unit,
          batch: prod.batch,
          exp: prod.exp,
          rate: prod.rate
        });
      }

      invoiceState.items = items;
      renderInvoice(invoiceState);
    }
