  <!-- JavaScript Engine for Natural Auto-Fit & Multi-Page Pagination -->
  <script>
    /**
     * WMS Thermocol Tax Invoice Engine (A4 Landscape)
     * Layout: 297mm width x 210mm height
     *
     * Natural Content-Based Pagination Logic:
     * - Does NOT use hardcoded row count limits.
     * - The printable usable height for A4 landscape with 3mm margin & 6mm padding is ~194mm (~733px).
     * - When items overflow the available printable height of the first page, subsequent pages are generated.
     * - "To be continued..." appears strictly in English at the bottom-right of non-final pages.
     * - Bottom summary totals, transporter details, consignment metrics, and signatures appear ONLY on the last page.
     * - Dynamic page numbering "Page X of Y" is placed in the footer of every page.
     */

    // Indian Currency Number to Words Formatter
    function numberToWordsINR(amount) {
      const num = Math.round(Number(amount) || 0);
      if (num === 0) return "Zero Rupees Only";

      const a = [
        "", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
        "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"
      ];
      const b = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];

      function inWords(n) {
        let str = "";
        if (n > 19) {
          str += b[Math.floor(n / 10)] + (n % 10 !== 0 ? " " + a[n % 10] : "");
        } else if (n > 0) {
          str += a[n];
        }
        return str;
      }

      let crore = Math.floor(num / 10000000);
      let remainder = num % 10000000;
      let lakh = Math.floor(remainder / 100000);
      remainder = remainder % 100000;
      let thousand = Math.floor(remainder / 1000);
      remainder = remainder % 1000;
      let hundred = Math.floor(remainder / 100);
      let tens = remainder % 100;

      let res = "";
      if (crore > 0) res += inWords(crore) + " Crore ";
      if (lakh > 0) res += inWords(lakh) + " Lakh ";
      if (thousand > 0) res += inWords(thousand) + " Thousand ";
      if (hundred > 0) res += inWords(hundred) + " Hundred ";
      if (tens > 0) res += (res !== "" ? "and " : "") + inWords(tens) + " ";

      return (res.trim() + " Rupees Only");
    }

    // Default Thermocol Stock Transfer Invoice Dataset
    const invoiceState = {
      invoiceNo: "STN/2026/0491",
      date: "2026-10-24",
      placeOfSupply: "Madhya Pradesh (23)",
      eWayBillNo: "3810 9942 8120",
      poReference: "PO-WH-IND-9921",
      reverseCharge: "No",

      // Consignor (Shipped & Dispatched From)
      consignor: {
        name: "ABBOTT HEALTHCARE PRIVATE LIMITED",
        subDivision: "Central Warehousing & Logistics Division",
        address: "Survey No 52/2/2, Peer Karadiya, Kshipra Road, Tehsil - Sanwer, Indore - 453771 (M.P.)",
        gstin: "23AAACA0231P1Z1",
        pan: "AAACA0231P",
        state: "Madhya Pradesh",
        stateCode: "23"
      },

      // Consignee (Billed To / Stock Transfer Destination)
      consignee: {
        name: "ABBOTT INDIA LIMITED - AHMEDABAD REGIONAL DEPOT",
        address: "Plot No. 14/B, Changodar Industrial Estate, Sanand, Ahmedabad - 382213 (Gujarat)",
        gstin: "24AAACA0231P1ZA",
        pan: "AAACA0231P",
        state: "Gujarat",
        stateCode: "24"
      },

      // Logistics & Consignment Metrics
      transporter: {
        name: "SafeXpress Logistics Pvt. Ltd.",
        vehicleNo: "MP-09-GH-8821",
        lrNo: "LR-7729108",
        lrDate: "2026-10-24",
        numberOfCases: "184 Boxes",
        grossWeight: "1,420 KGS",
        netWeight: "1,290 KGS",
        volumeCft: "480 CFT",
        driverPhone: "+91 98260 11223"
      },

      items: []
    };

    // Realistic Packaging & Thermocol Products
    const thermocolProductCatalog = [
      { name: 'Thermocol Box 12 Litre Molded EPS High Density (28mm Wall)', hsn: '39239090', unit: 'NOS', rate: 145.00 },
      { name: 'Thermocol Box 24 Litre Cold Chain Vaccine Ice Box', hsn: '39239090', unit: 'NOS', rate: 215.00 },
      { name: 'Thermocol Box 36 Litre Insulated Pharmaceutical Shipper', hsn: '39239090', unit: 'NOS', rate: 320.00 },
      { name: 'Thermocol Lid Top Cover EPS 25mm thickness interlocking', hsn: '39239090', unit: 'NOS', rate: 45.00 },
      { name: 'Thermocol Corner Protector 3-Way Heavy Duty Molded', hsn: '39239090', unit: 'NOS', rate: 18.50 },
      { name: 'Thermocol Sheet 50mm High Density EPS Insulation Plate', hsn: '39239090', unit: 'SHT', rate: 180.00 },
      { name: 'Thermocol Partition Separator Plate 6 Cavity Vial Tray', hsn: '39239090', unit: 'NOS', rate: 65.00 },
      { name: 'HDPE Gel Pack Bottle 500ml Phase Change Cold Coolant', hsn: '38249900', unit: 'NOS', rate: 38.00 },
      { name: 'Corrugated Outer Shipper 7-Ply Heavy Master Box (Kraft)', hsn: '48191010', unit: 'NOS', rate: 95.00 },
      { name: 'BOPP Self Adhesive Transparent Packaging Tape 3" x 65M', hsn: '39191000', unit: 'ROL', rate: 58.00 },
      { name: 'Thermal Insulation Air Bubble Roll 1.2m x 50m Heavy Grade', hsn: '39269099', unit: 'ROL', rate: 840.00 },
      { name: 'Polyethylene Stretch Wrap Film 23 Micron Industrial Cast', hsn: '39201019', unit: 'ROL', rate: 420.00 },
      { name: 'Moisture Barrier Silica Gel Desiccant Sachet 100g Bag', hsn: '28112200', unit: 'PKT', rate: 22.00 },
      { name: 'Fragile Handle With Care Temperature Sensitive Warning Label', hsn: '48211010', unit: 'ROL', rate: 140.00 },
      { name: 'Thermocol Base Tray 10 Cavity Ampoule Safety Cushioning', hsn: '39239090', unit: 'NOS', rate: 52.00 },
      { name: 'Molded Pulp Edge Board Corner Protector Strip 50x50x4mm', hsn: '48239090', unit: 'NOS', rate: 28.00 }
    ];

    /**
     * Natural Content Auto-Fit Slicer:
     * Evaluates actual content height dynamics:
     * - In A4 landscape (210mm total height minus 12mm page padding = ~198mm max usable).
     * - Fixed Header + Parties block = ~52mm
     * - Table headers + spacing = ~8mm
     * - Continuation notice = ~5mm
     * - Bottom summary box + Signatures + Transporter metrics + Footer = ~56mm
     *
     * Available table height on non-final page: ~198 - 52 - 8 - 5 - 6 (footer) = ~127mm (~16-17 rows).
     * Available table height on final page: ~198 - 52 - 8 - 56 - 6 (footer) = ~76mm (~10-11 rows).
     *
     * Natural Auto-Fit Algorithm:
     * If all remaining items fit together with the bottom summary block (<= 11 items),
     * they are kept on the final page!
     * When content exceeds page height, rows naturally spill over into the next page.
     */
    function partitionItemsNaturally(items) {
      const total = items.length;
      if (total === 0) return [[]];

      // If all items fit comfortably on a single page with the summary block (up to 11 items)
      if (total <= 11) {
        return [items];
      }

      const pages = [];
      let startIdx = 0;

      while (startIdx < total) {
        const remaining = total - startIdx;

        // If the remaining items fit on the final page with the summary block
        if (remaining <= 11) {
          pages.push(items.slice(startIdx, total));
          break;
        }

        // Available capacity on a non-final page (without summary block) is up to 16 items
        let take = 16;
        if (remaining <= 16) {
          // Balance nicely between this page and the final page
          take = Math.ceil(remaining / 2);
        }

        pages.push(items.slice(startIdx, startIdx + take));
        startIdx += take;
      }

      return pages;
    }

    /**
     * Main Render Routine
     */
    function renderInvoice(invoiceData) {
      const container = document.getElementById('invoicePagesContainer');
      if (!container) return;

      // Compute financial totals
      let totalQty = 0;
      let totalTaxable = 0;
